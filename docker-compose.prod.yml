services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      SERVER_ADDRESS: 0.0.0.0
      APP_PUBLIC_BASE_URL: https://${DOMAIN}
      TOSS_MODE: ${TOSS_MODE:?TOSS_MODE is required}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:?TOSS_CLIENT_KEY is required}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:?TOSS_SECRET_KEY is required}
      TOSS_CONNECT_TIMEOUT: ${TOSS_CONNECT_TIMEOUT:-3s}
      TOSS_READ_TIMEOUT: ${TOSS_READ_TIMEOUT:-10s}
      SMS_MODE: ${SMS_MODE:-disabled}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      SOLAPI_SENDER: ${SOLAPI_SENDER:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DATA_RETENTION_ENABLED: ${DATA_RETENTION_ENABLED:-true}
      UNPAID_ORDER_TTL: ${UNPAID_ORDER_TTL:-7d}
      DATA_CLEANUP_BATCH_SIZE: ${DATA_CLEANUP_BATCH_SIZE:-100}
      DATA_CLEANUP_CRON: "${DATA_CLEANUP_CRON:-0 17 * * * *}"
      DATA_CLEANUP_ZONE: ${DATA_CLEANUP_ZONE:-Asia/Seoul}
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - product_uploads:/app/uploads
    expose: ["8080"]
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev,noexec
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  cloudflared:
    image: cloudflare/cloudflared:2026.6.0
    user: "0:0"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,nosuid,nodev,noexec
    logging:
      options:
        max-size: "10m"
        max-file: "5"

networks:
  backend:

volumes:
  postgres_data:
  product_uploads:

secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare-tunnel-token.txt
