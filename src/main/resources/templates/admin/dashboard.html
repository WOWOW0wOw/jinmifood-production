<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 대시보드</title><link rel="stylesheet" href="/css/style.css"></head><body class="admin-body"><aside th:replace="~{admin/fragments :: side}"></aside><main class="admin-main"><header><div><small>OVERVIEW</small><h1>대시보드</h1></div><span th:text="${#temporals.format(#temporals.createNow(),'yyyy년 M월 d일')}"></span></header><section class="stats"><div><span>전체 주문</span><strong th:text="${orderCount}">0</strong></div><div><span>확인 필요</span><strong th:text="${pendingCount}">0</strong></div><div><span>등록 상품</span><strong th:text="${productCount}">0</strong></div><div><span>누적 주문액</span><strong th:text="${#numbers.formatInteger(revenue,1,'COMMA')}+'원'"></strong></div></section><section class="admin-card"><div class="admin-card-head"><h2>최근 주문</h2><a href="/admin/orders">전체 보기</a></div><div class="table-wrap"><table><thead><tr><th>주문번호</th><th>고객</th><th>금액</th><th>상태</th><th>접수일</th></tr></thead><tbody><tr th:each="o:${recentOrders}"><td th:text="${o.orderNumber}"></td><td th:text="${o.customerName}"></td><td th:text="${#numbers.formatInteger(o.totalAmount,1,'COMMA')}+'원'"></td><td><span class="status" th:text="${o.status.label}"></span></td><td th:text="${#temporals.format(o.createdAt,'MM-dd HH:mm')}"></td></tr><tr th:if="${#lists.isEmpty(recentOrders)}"><td colspan="5">아직 접수된 주문이 없습니다.</td></tr></tbody></table></div></section></main></body></html>
