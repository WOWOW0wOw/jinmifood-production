<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상품 문의 관리</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/community.css"><link rel="stylesheet" href="/css/pagination.css"></head><body class="admin-body"><aside th:replace="~{admin/fragments :: side}"></aside><main class="admin-main"><header><div><small>COMMUNITY</small><h1>상품 문의 관리</h1></div></header><div class="toast static" th:if="${message}" th:text="${message}"></div><section class="admin-card inquiry-admin"><article th:each="inquiry:${inquiries.content}"><header><div><span class="status" th:text="${inquiry.answered}?'답변완료':'답변대기'"></span><strong th:text="${inquiry.title}"></strong></div><a th:href="@{/products/{slug}(slug=${inquiry.product.slug})}" target="_blank" th:text="${inquiry.product.name}+' ↗'"></a></header><div class="inquiry-meta"><span th:text="${inquiry.member.email}"></span><time th:text="${#temporals.format(inquiry.createdAt,'yyyy.MM.dd HH:mm')}"></time></div><p th:text="${inquiry.content}"></p><form th:action="@{/admin/inquiries/{id}/answer(id=${inquiry.id})}" method="post"><label>관리자 답변<textarea name="answer" maxlength="3000" rows="4" required th:text="${inquiry.answer}"></textarea></label><button class="btn">답변 저장</button></form><form th:action="@{/admin/inquiries/{id}/delete(id=${inquiry.id})}" method="post"><button class="link-btn" type="submit">문의 삭제</button></form></article><div class="empty compact" th:if="${inquiries.empty}">등록된 상품 문의가 없습니다.</div></section><nav class="pagination" th:if="${inquiries.totalPages>1}"><a th:if="${inquiries.hasPrevious()}" th:href="@{/admin/inquiries(page=${inquiries.number-1})}">이전</a><span th:text="${inquiries.number+1}+' / '+${inquiries.totalPages}"></span><a th:if="${inquiries.hasNext()}" th:href="@{/admin/inquiries(page=${inquiries.number+1})}">다음</a></nav></main></body></html>
