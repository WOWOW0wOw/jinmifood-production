<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원 상세</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin-members.css"></head>
<body class="admin-body"><aside th:replace="~{admin/fragments :: side}"></aside><main class="admin-main">
<header><div><small>MEMBER DETAIL</small><h1 th:text="${member.name}+' 회원'"></h1></div><a href="/admin/members">← 목록으로</a></header><div class="toast static" th:if="${message}" th:text="${message}"></div>
<section class="member-admin-grid"><div class="admin-card member-profile"><h2>회원 정보</h2><dl><div><dt>이메일</dt><dd th:text="${member.email}"></dd></div><div><dt>이름</dt><dd th:text="${member.name}"></dd></div><div><dt>생년월일</dt><dd th:text="${member.birthDate==null}?'-':${#temporals.format(member.birthDate,'yyyy-MM-dd')}"></dd></div><div><dt>휴대전화</dt><dd th:text="${member.phone.isBlank()}?'-':${member.phone}"></dd></div><div><dt>기본 배송지</dt><dd th:text="${member.address==null}?'-':'['+${member.postalCode}+'] '+${member.address}+' '+${member.addressDetail?:''}"></dd></div><div><dt>가입일</dt><dd th:text="${#temporals.format(member.createdAt,'yyyy-MM-dd HH:mm')}"></dd></div><div th:if="${member.withdrawn}"><dt>탈퇴일</dt><dd th:text="${#temporals.format(member.withdrawnAt,'yyyy-MM-dd HH:mm')}"></dd></div><div><dt>소셜 연동</dt><dd><span th:if="${#lists.isEmpty(socialAccounts)}">-</span><span class="provider-badge" th:each="a:${socialAccounts}" th:text="${#strings.toUpperCase(a.provider)}"></span></dd></div></dl></div>
<div class="member-stat-list"><div><small>현재 포인트</small><strong th:text="${#numbers.formatInteger(member.points,1,'COMMA')}+'P'"></strong></div><div><small>주문 횟수</small><strong th:text="${orderCount}+'건'"></strong></div><div><small>결제 완료액</small><strong th:text="${#numbers.formatInteger(paidAmount,1,'COMMA')}+'원'"></strong></div></div></section>
<section class="member-actions" th:unless="${member.withdrawn}"><form class="admin-card action-card" th:action="@{/admin/members/{id}/status(id=${member.id})}" method="post"><h2>계정 상태</h2><p th:text="${member.active}?'현재 정상 이용 중입니다.':'현재 로그인이 차단된 계정입니다.'"></p><input type="hidden" name="active" th:value="${!member.active}"><input name="reason" maxlength="200" placeholder="변경 사유(선택)"><button class="btn" th:text="${member.active}?'로그인 차단':'계정 복구'"></button></form>
<form class="admin-card action-card" th:action="@{/admin/members/{id}/admin(id=${member.id})}" method="post"><h2>관리자 권한</h2><p th:text="${member.admin}?'관리자 권한을 보유하고 있습니다.':'일반 회원입니다.'"></p><input type="hidden" name="admin" th:value="${!member.admin}"><input name="reason" maxlength="200" placeholder="변경 사유(선택)"><button class="btn" th:text="${member.admin}?'권한 해제':'관리자 부여'"></button></form>
<form class="admin-card action-card" th:action="@{/admin/members/{id}/points(id=${member.id})}" method="post"><h2>포인트 조정</h2><p>지급은 양수, 차감은 음수로 입력하세요.</p><input name="delta" type="number" min="-1000000" max="1000000" required placeholder="예: 1000 또는 -1000"><input name="reason" maxlength="200" required placeholder="조정 사유"><button class="btn">포인트 조정</button></form><form class="admin-card action-card danger-card" th:action="@{/admin/members/{id}/withdraw(id=${member.id})}" method="post"><h2>회원 강제 탈퇴</h2><p>주문·결제 이력은 보존하고 회원 개인정보와 소셜 연결을 제거합니다.</p><input name="reason" maxlength="200" required placeholder="강제 탈퇴 사유"><button class="btn danger-button">회원 탈퇴 처리</button></form></section>
<section class="admin-card member-section"><div class="admin-card-head"><h2>최근 주문</h2><span>최대 20건</span></div><div class="table-wrap"><table><thead><tr><th>주문번호</th><th>상태</th><th>금액</th><th>주문일</th></tr></thead><tbody><tr th:each="o:${orders}"><td th:text="${o.orderNumber}"></td><td th:text="${o.status.label}"></td><td th:text="${#numbers.formatInteger(o.totalAmount,1,'COMMA')}+'원'"></td><td th:text="${#temporals.format(o.createdAt,'yyyy-MM-dd HH:mm')}"></td></tr><tr th:if="${#lists.isEmpty(orders)}"><td colspan="4">주문 내역이 없습니다.</td></tr></tbody></table></div></section>
<section class="admin-card member-section"><div class="admin-card-head"><h2>변경 이력</h2><span>최대 30건</span></div><div class="table-wrap"><table><thead><tr><th>일시</th><th>관리자</th><th>항목</th><th>변경</th><th>사유</th></tr></thead><tbody><tr th:each="a:${actions}"><td th:text="${#temporals.format(a.createdAt,'yyyy-MM-dd HH:mm')}"></td><td th:text="${a.actor}"></td><td th:text="${a.action}"></td><td th:text="${a.beforeValue}+' → '+${a.afterValue}"></td><td th:text="${a.reason?:'-'}"></td></tr><tr th:if="${#lists.isEmpty(actions)}"><td colspan="5">변경 이력이 없습니다.</td></tr></tbody></table></div></section>
</main></body></html>
