<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원 관리</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin-members.css"></head>
<body class="admin-body"><aside th:replace="~{admin/fragments :: side}"></aside><main class="admin-main">
<header><div><small>MEMBERS</small><h1>회원 관리</h1></div><span th:text="'총 '+${members.totalElements}+'명'"></span></header>
<form class="admin-search" method="get" action="/admin/members"><label class="sr-only" for="member-q">회원 검색</label><input id="member-q" name="q" th:value="${q}" placeholder="이름, 이메일, 휴대전화 검색"><button class="btn">검색</button><a th:if="${!q.isBlank()}" href="/admin/members">초기화</a></form>
<section class="admin-card"><div class="table-wrap"><table><thead><tr><th>회원</th><th>가입방식</th><th>연락처</th><th>포인트</th><th>권한</th><th>상태</th><th>가입일</th><th></th></tr></thead><tbody>
<tr th:each="m:${members.content}"><td><strong th:text="${m.name}"></strong><br><small th:text="${m.email}"></small></td><td><span th:if="${providers.get(m.id)==null}" class="provider-badge">EMAIL</span><span th:each="provider:${providers.get(m.id)}" class="provider-badge" th:text="${provider}"></span></td><td th:text="${m.phone.isBlank()}?'-':${m.phone}"></td><td th:text="${#numbers.formatInteger(m.points,1,'COMMA')}+'P'"></td><td><span class="status" th:if="${m.admin}">관리자</span><span th:unless="${m.admin}">회원</span></td><td><span class="status" th:classappend="${!m.active}?' status-blocked'" th:text="${m.withdrawn}?'탈퇴':(${m.active}?'정상':'차단')"></span></td><td th:text="${#temporals.format(m.createdAt,'yyyy-MM-dd')}"></td><td><a th:href="@{/admin/members/{id}(id=${m.id})}">상세·관리</a></td></tr>
<tr th:if="${members.empty}"><td colspan="8">조건에 맞는 회원이 없습니다.</td></tr></tbody></table></div></section>
<nav class="admin-pagination" th:if="${members.totalPages>1}"><a th:if="${members.hasPrevious()}" th:href="@{/admin/members(q=${q},page=${members.number-1})}">← 이전</a><span th:text="${members.number+1}+' / '+${members.totalPages}"></span><a th:if="${members.hasNext()}" th:href="@{/admin/members(q=${q},page=${members.number+1})}">다음 →</a></nav>
</main></body></html>
