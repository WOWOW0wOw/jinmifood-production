<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공지 작성</title><link rel="stylesheet" href="/css/style.css"></head><body class="admin-body"><aside th:replace="~{admin/fragments :: side}"></aside><main class="admin-main"><header><div><small>COMMUNITY</small><h1 th:text="${noticeId == null}?'공지 등록':'공지 수정'"></h1></div><a href="/admin/notices">목록으로</a></header><div class="toast static" th:if="${message}" th:text="${message}"></div><section class="admin-card"><form class="product-form field-grid" action="/admin/notices/save" method="post"><input type="hidden" name="id" th:value="${noticeId}"><label class="full">제목<input name="title" maxlength="160" required th:value="${title}"></label><label class="full">내용<textarea name="content" maxlength="10000" rows="16" required th:text="${content}"></textarea></label><label class="check full"><input type="checkbox" name="pinned" value="true" th:checked="${pinned}"> 중요 공지로 상단 고정</label><button class="btn" type="submit">저장</button></form><form th:if="${noticeId != null}" th:action="@{/admin/notices/{id}/delete(id=${noticeId})}" method="post" class="product-form"><button class="btn danger-button" type="submit">공지 삭제</button></form></section></main></body></html>
