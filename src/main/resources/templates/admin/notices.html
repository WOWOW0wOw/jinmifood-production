<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공지 관리</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/pagination.css"></head><body class="admin-body"><aside th:replace="~{admin/fragments :: side}"></aside><main class="admin-main"><header><div><small>COMMUNITY</small><h1>공지 관리</h1></div><a class="btn" href="/admin/notices/new">+ 공지 등록</a></header><div class="toast static" th:if="${message}" th:text="${message}"></div><section class="admin-card"><div class="table-wrap"><table><thead><tr><th>구분</th><th>제목</th><th>등록일</th><th></th></tr></thead><tbody><tr th:each="notice:${notices.content}"><td><span class="status" th:text="${notice.pinned}?'중요':'일반'"></span></td><td><strong th:text="${notice.title}"></strong></td><td th:text="${#temporals.format(notice.createdAt,'yyyy.MM.dd HH:mm')}"></td><td><a th:href="@{/admin/notices/{id}/edit(id=${notice.id})}">수정</a></td></tr><tr th:if="${notices.empty}"><td colspan="4">등록된 공지사항이 없습니다.</td></tr></tbody></table></div></section><nav class="pagination" th:if="${notices.totalPages>1}"><a th:if="${notices.hasPrevious()}" th:href="@{/admin/notices(page=${notices.number-1})}">이전</a><span th:text="${notices.number+1}+' / '+${notices.totalPages}"></span><a th:if="${notices.hasNext()}" th:href="@{/admin/notices(page=${notices.number+1})}">다음</a></nav></main></body></html>
