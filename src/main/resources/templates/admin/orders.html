<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주문 관리</title><link rel="stylesheet" href="/css/style.css"></head><body class="admin-body"><aside th:replace="~{admin/fragments :: side}"></aside><main class="admin-main"><header><div><small>ORDERS</small><h1>주문 관리</h1></div></header><div class="toast static" th:if="${message}" th:text="${message}"></div><section class="admin-card"><div class="table-wrap"><table><thead><tr><th>주문정보</th><th>배송지</th><th>상품</th><th>금액·결제</th><th>상태 변경</th></tr></thead><tbody><tr th:each="o:${orders}"><td><strong th:text="${o.orderNumber}"></strong><br><span th:text="${o.customerName}+' · '+${o.phone}"></span><br><small th:text="${#temporals.format(o.createdAt,'yyyy-MM-dd HH:mm')}"></small></td><td><span th:text="'['+${o.postalCode}+'] '+${o.address}+' '+${o.addressDetail}"></span><br><small th:text="${o.deliveryMemo}"></small></td><td><div th:each="i:${o.items}" th:text="${i.productName}+' × '+${i.quantity}"></div></td><td><strong th:text="${#numbers.formatInteger(o.totalAmount,1,'COMMA')}+'원'"></strong><br><small th:text="${o.paymentStatus}+' · '+${o.paymentMethod?:'미결제'}"></small><br><a th:if="${o.receiptUrl}" th:href="${o.receiptUrl}" target="_blank" rel="noopener">영수증</a></td><td><form th:action="@{/admin/orders/{id}/status(id=${o.id})}" method="post" class="status-form"><select name="status"><option th:each="s:${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s==o.status}"></option></select><button>변경</button></form><form th:if="${o.paymentStatus.name()=='PAID'}" th:action="@{/admin/orders/{id}/payment/cancel(id=${o.id})}" method="post" class="status-form"><input type="hidden" name="reason" value="관리자 주문 취소"><button type="submit">결제 취소</button></form></td></tr><tr th:if="${#lists.isEmpty(orders)}"><td colspan="5">주문이 없습니다.</td></tr></tbody></table></div></section></main></body></html>
