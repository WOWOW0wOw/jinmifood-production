<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상품 관리</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/pagination.css"></head><body class="admin-body"><aside th:replace="~{admin/fragments :: side}"></aside><main class="admin-main"><header><div><small>CATALOG</small><h1>상품 관리</h1></div><a class="btn" href="/admin/products/new">+ 상품 등록</a></header><div class="toast static" th:if="${message}" th:text="${message}"></div><section class="admin-card"><div class="table-wrap"><table><thead><tr><th>상품</th><th>카테고리</th><th>판매가</th><th>재고</th><th>상태</th><th></th></tr></thead><tbody><tr th:each="p:${products.content}"><td><div class="admin-product"><img th:src="${p.imageUrl}" th:alt="${p.name}"><strong th:text="${p.name}"></strong></div></td><td th:text="${p.category.name}"></td><td th:text="${#numbers.formatInteger(p.price,1,'COMMA')}+'원'"></td><td th:text="${p.stock}"></td><td><span class="status" th:text="${p.active}?'판매중':'숨김'"></span></td><td><a th:href="@{/admin/products/{id}/edit(id=${p.id})}">수정</a></td></tr><tr th:if="${products.empty}"><td colspan="6">등록된 상품이 없습니다.</td></tr></tbody></table></div></section><nav class="pagination" th:if="${products.totalPages>1}" aria-label="상품 관리 페이지"><a th:if="${products.hasPrevious()}" th:href="@{/admin/products(page=${products.number-1})}">이전</a><span th:text="${products.number+1}+' / '+${products.totalPages}"></span><a th:if="${products.hasNext()}" th:href="@{/admin/products(page=${products.number+1})}">다음</a></nav></main></body></html>
