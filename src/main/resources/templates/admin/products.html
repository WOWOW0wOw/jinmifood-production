<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상품 관리</title><link rel="stylesheet" href="/css/style.css"></head><body class="admin-body"><aside th:replace="~{admin/fragments :: side}"></aside><main class="admin-main"><header><div><small>CATALOG</small><h1>상품 관리</h1></div><a class="btn" href="/admin/products/new">+ 상품 등록</a></header><div class="toast static" th:if="${message}" th:text="${message}"></div><section class="admin-card"><div class="table-wrap"><table><thead><tr><th>상품</th><th>카테고리</th><th>판매가</th><th>재고</th><th>상태</th><th></th></tr></thead><tbody><tr th:each="p:${products}"><td><div class="admin-product"><img th:src="${p.imageUrl}" th:alt="${p.name}"><strong th:text="${p.name}"></strong></div></td><td th:text="${p.category.name}"></td><td th:text="${#numbers.formatInteger(p.price,1,'COMMA')}+'원'"></td><td th:text="${p.stock}"></td><td><span class="status" th:text="${p.active}?'판매중':'숨김'"></span></td><td><a th:href="@{/admin/products/{id}/edit(id=${p.id})}">수정</a></td></tr></tbody></table></div></section></main></body></html>
