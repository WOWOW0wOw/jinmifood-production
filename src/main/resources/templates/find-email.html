<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="_csrf" th:content="${_csrf.token}"><title>아이디 찾기 | 진미푸드</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/member.css"><link rel="stylesheet" href="/css/auth.css"><script src="/js/sms-verification.js" defer></script></head><body class="login-page"><main class="login-card"><a class="brand" href="/"><span>眞味</span> 진미푸드</a><h1>아이디 찾기</h1><p>가입할 때 등록한 이름과 휴대전화로 확인합니다.</p><div class="form-error" th:if="${error}" th:text="${error}"></div><div class="recovery-result" th:if="${emails}"><b th:if="${!emails.isEmpty()}">가입 아이디</b><p th:each="email:${emails}" th:text="${email}"></p><p th:if="${emails.isEmpty()}">일치하는 회원 정보가 없습니다.</p></div><form method="post" th:action="@{/account/find-email}"><label>이름<input name="name" autocomplete="name" required></label><div class="sms-widget" data-sms-widget data-purpose="FIND_EMAIL"><label>휴대전화<input name="phone" data-sms-phone inputmode="tel" placeholder="010-0000-0000" required></label><div class="sms-actions"><button type="button" class="btn-sub" data-sms-send th:disabled="${!smsConfigured}">인증번호 발송</button><input data-sms-code inputmode="numeric" maxlength="6" placeholder="인증번호 6자리"><button type="button" class="btn-sub" data-sms-verify th:disabled="${!smsConfigured}">인증 확인</button></div><p class="sms-status" data-sms-status th:text="${smsConfigured ? '휴대전화 인증을 완료해 주세요.' : '문자인증 서비스가 아직 설정되지 않았습니다.'}"></p></div><button class="btn btn-block" data-sms-required disabled>아이디 확인</button></form><a href="/login">← 로그인으로 돌아가기</a></main></body></html>
