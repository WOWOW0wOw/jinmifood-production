<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="_csrf" th:content="${_csrf.token}"><title>비밀번호 재설정 | 진미푸드</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/member.css"><link rel="stylesheet" href="/css/auth.css"><script src="/js/sms-verification.js" defer></script></head><body class="login-page"><main class="login-card"><a class="brand" href="/"><span>眞味</span> 진미푸드</a><h1>비밀번호 재설정</h1><p>아이디와 휴대전화 인증 후 새 비밀번호를 설정합니다.</p><div class="form-error" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/password/forgot}"><label>이메일 아이디<input name="email" type="email" autocomplete="username" required></label><div class="sms-widget" data-sms-widget data-purpose="RESET_PASSWORD"><label>휴대전화<input name="phone" data-sms-phone inputmode="tel" placeholder="010-0000-0000" required></label><div class="sms-actions"><button type="button" class="btn-sub" data-sms-send th:disabled="${!smsConfigured}">인증번호 발송</button><input data-sms-code inputmode="numeric" maxlength="6" placeholder="인증번호 6자리"><button type="button" class="btn-sub" data-sms-verify th:disabled="${!smsConfigured}">인증 확인</button></div><p class="sms-status" data-sms-status th:text="${smsConfigured ? '휴대전화 인증을 완료해 주세요.' : '문자인증 서비스가 아직 설정되지 않았습니다.'}"></p></div><button class="btn btn-block" data-sms-required disabled>새 비밀번호 설정</button></form><a href="/login">← 로그인으로 돌아가기</a></main></body></html>
