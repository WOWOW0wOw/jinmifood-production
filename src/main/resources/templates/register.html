<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="_csrf" th:content="${_csrf.token}">
<title>회원가입 | 진미푸드</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/member.css">
<link rel="stylesheet" href="/css/auth.css">
<script src="/js/sms-verification.js" defer></script>
</head>
<body class="login-page">
<main class="login-card register-card">
<a class="brand" href="/">
<span>眞味</span> 진미푸드</a>
<h1>회원가입</h1>
<p>결제완료 상품금액의 10%가 포인트로 적립됩니다.</p>
<form th:action="@{/register}" method="post" th:object="${registrationForm}">
<div class="form-error" th:if="${#fields.hasAnyErrors()}">
<span th:each="e:${#fields.allErrors()}" th:text="${e}">
</span>
</div>
<label>이메일<input th:field="*{email}" type="email" autocomplete="email" required>
</label>
<label>이름<input th:field="*{name}" data-sms-name autocomplete="name" required>
</label>
<label>생년월일<input th:field="*{birthDate}" data-sms-birth type="date" autocomplete="bday" required></label>
<div class="sms-widget" data-sms-widget data-purpose="REGISTER">
<label>휴대전화<input th:field="*{phone}" data-sms-phone inputmode="tel" placeholder="010-0000-0000" required>
</label>
<div class="sms-actions"><button type="button" class="btn-sub" data-sms-send th:disabled="${!smsConfigured}">인증번호 발송</button><input data-sms-code inputmode="numeric" maxlength="6" placeholder="인증번호 6자리"><button type="button" class="btn-sub" data-sms-verify th:disabled="${!smsConfigured}">인증 확인</button></div>
<p class="sms-status" data-sms-status th:text="${smsConfigured ? '휴대전화 인증을 완료해 주세요.' : '문자인증 서비스 설정 후 가입할 수 있습니다.'}"></p>
</div>
<label>비밀번호<input th:field="*{password}" type="password" autocomplete="new-password" minlength="8" required>
<small>영문과 숫자를 포함해 8자 이상</small>
</label>
<label>비밀번호 확인<input th:field="*{passwordConfirm}" type="password" autocomplete="new-password" required>
</label>
<button class="btn btn-block" data-sms-required disabled>가입하기</button>
</form>
<div class="social-login" th:if="${!#lists.isEmpty(socialProviders)}"><span>또는 간편 회원가입</span><a th:if="${#lists.contains(socialProviders,'google')}" href="/oauth2/authorization/google" class="social google">Google로 계속하기</a><a th:if="${#lists.contains(socialProviders,'kakao')}" href="/oauth2/authorization/kakao" class="social kakao">카카오로 계속하기</a><a th:if="${#lists.contains(socialProviders,'naver')}" href="/oauth2/authorization/naver" class="social naver">네이버로 계속하기</a></div>
<a href="/login">이미 회원이신가요? 로그인</a>
</main>
</body>
</html>
