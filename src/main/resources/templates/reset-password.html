<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새 비밀번호 설정 | 진미푸드</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/member.css"></head><body class="login-page"><main class="login-card"><a class="brand" href="/"><span>眞味</span> 진미푸드</a><h1>새 비밀번호 설정</h1><p>영문과 숫자를 포함해 8자 이상 입력해 주세요.</p><form method="post" th:action="@{/password/reset}" th:object="${passwordResetForm}"><div class="form-error" th:if="${#fields.hasAnyErrors()}"><span th:each="e:${#fields.allErrors()}" th:text="${e}"></span></div><label>새 비밀번호<input type="password" th:field="*{password}" autocomplete="new-password" required></label><label>비밀번호 확인<input type="password" th:field="*{passwordConfirm}" autocomplete="new-password" required></label><button class="btn btn-block">비밀번호 변경</button></form></main></body></html>
