<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>진미푸드 소개</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments :: header}"></header><main><section class="about-hero"><div class="wrap about-hero-inner"><div class="about-copy"><span class="eyebrow">ABOUT JINMI</span><h1>참된 맛을 전하는<br>진미푸드입니다</h1><p>좋은 재료를 정직하게 골라 매일의 식탁에 전합니다.</p></div><figure class="about-visual"><img src="/images/brand/pantry-collection.jpg" alt="진미푸드의 짝태와 미역, 오징어 등 엄선한 식재료" fetchpriority="high"></figure></div></section><section class="section wrap prose"><h2>작지만 믿을 수 있는 식품점</h2><p>서울 영등포에서 시작한 진미푸드는 먹태, 짝태, 미역, 오징어와 다양한 식재료를 소개합니다. 고객이 무엇을 받게 되는지 정확히 알 수 있도록 상품 정보와 가격, 배송 기준을 투명하게 안내합니다.</p><div class="values"><div><b>정직</b><p>과장하지 않고 상품 정보를 정확히 안내합니다.</p></div><div><b>선별</b><p>판매자가 먼저 살펴보고 품질을 확인합니다.</p></div><div><b>책임</b><p>문의와 주문에 끝까지 친절하게 대응합니다.</p></div></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
