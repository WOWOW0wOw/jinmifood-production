<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>장바구니 | 진미푸드</title><link rel="stylesheet" href="/css/style.css?v=20260820-1"><th:block th:replace="~{fragments :: storefrontHead}"></th:block></head><body><header th:replace="~{fragments :: header}"></header><main class="section wrap"><div class="page-title"><span class="eyebrow">YOUR CART</span><h1>장바구니</h1></div><div class="empty" th:if="${#lists.isEmpty(cart.lines)}"><h2>장바구니가 비어 있습니다</h2><p>맛있는 건어물을 둘러보세요.</p><a class="btn" href="/products">상품 보러 가기</a></div><div class="cart-layout" th:unless="${#lists.isEmpty(cart.lines)}"><div class="cart-list"><article th:each="line:${cart.lines}"><img th:src="${line.product.imageUrl}" th:alt="${line.product.name}"><div><small th:text="${line.product.category.name}"></small><h3 th:text="${line.product.name}"></h3><span th:text="${#numbers.formatInteger(line.product.price,1,'COMMA')}+'원'"></span></div><form th:action="@{/cart/update}" method="post"><input type="hidden" name="productId" th:value="${line.product.id}"><label>수량 <input type="number" name="quantity" th:value="${line.quantity}" min="0" th:max="${line.product.stock}"></label><button class="link-btn">변경</button></form><strong th:text="${#numbers.formatInteger(line.lineTotal,1,'COMMA')}+'원'"></strong></article></div><aside class="order-summary"><h2>결제 예정 금액</h2><dl><div><dt>상품금액</dt><dd th:text="${#numbers.formatInteger(cart.subtotal,1,'COMMA')}+'원'"></dd></div><div><dt>배송비</dt><dd th:text="${cart.shippingFee == 0}?'무료':${#numbers.formatInteger(cart.shippingFee,1,'COMMA')}+'원'"></dd></div><div class="total"><dt>총 금액</dt><dd th:text="${#numbers.formatInteger(cart.total,1,'COMMA')}+'원'"></dd></div></dl><p th:if="${cart.subtotal < 50000}" th:text="${#numbers.formatInteger(50000-cart.subtotal,1,'COMMA')}+'원 더 담으면 무료배송!'" class="shipping-tip"></p><a class="btn btn-block" href="/checkout">주문하기</a></aside></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
