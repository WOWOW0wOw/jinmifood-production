<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>커뮤니티 | 진미푸드</title><link rel="stylesheet" href="/css/style.css?v=20260820-1"><th:block th:replace="~{fragments :: storefrontHead}"></th:block><link rel="stylesheet" href="/css/community.css"></head><body><header th:replace="~{fragments :: header}"></header><main class="section wrap"><div class="page-title"><span class="eyebrow">JINMI COMMUNITY</span><h1>커뮤니티</h1><p>새로운 소식과 쇼핑 이용 안내를 확인해 주세요.</p></div><div class="community-menu"><a href="/community/notices"><b>공지사항</b><span>배송·운영 관련 새로운 소식을 확인하세요.</span><em>바로가기 →</em></a><a href="/community/customer-center"><b>고객센터</b><span>주문, 배송, 교환·반품 도움말을 확인하세요.</span><em>바로가기 →</em></a></div><section class="board"><div class="board-head"><h2>최근 공지사항</h2><a href="/community/notices">전체보기</a></div><a class="board-row" th:each="notice:${notices.content}" th:href="@{/community/notices/{id}(id=${notice.id})}"><span class="pin" th:if="${notice.pinned}">중요</span><strong th:text="${notice.title}"></strong><time th:text="${#temporals.format(notice.createdAt,'yyyy.MM.dd')}"></time></a><div class="empty compact" th:if="${notices.empty}">등록된 공지사항이 없습니다.</div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
