<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마이페이지 | 진미푸드</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/pagination.css"></head>
<body><header th:replace="~{fragments :: header}"></header><main class="section wrap">
<div class="page-title"><span class="eyebrow">MY JINMI</span><h1>마이페이지</h1></div><section class="member-summary"><div><small>회원명</small><strong th:text="${member.name}"></strong></div><div><small>보유 포인트</small><strong th:text="${#numbers.formatInteger(member.points,1,'COMMA')}+'P'"></strong></div><div><small>기본 배송지</small><strong th:text="${member.address?:'아직 저장된 주소가 없습니다.'}"></strong></div></section>
<section class="admin-card my-orders"><div class="admin-card-head"><h2>주문 내역</h2></div><div class="empty" th:if="${orders.empty}">아직 주문 내역이 없습니다.</div><div class="table-wrap" th:unless="${orders.empty}"><table><thead><tr><th>주문번호</th><th>주문일</th><th>상태</th><th>결제금액</th><th>사용/적립 포인트</th></tr></thead><tbody><tr th:each="o:${orders.content}"><td th:text="${o.orderNumber}"></td><td th:text="${#temporals.format(o.createdAt,'yyyy-MM-dd HH:mm')}"></td><td><span class="status" th:text="${o.status.label}"></span></td><td th:text="${#numbers.formatInteger(o.totalAmount,1,'COMMA')}+'원'"></td><td th:text="${#numbers.formatInteger(o.pointsUsed,1,'COMMA')}+'P 사용 / '+${#numbers.formatInteger(o.pointsEarned,1,'COMMA')}+'P 적립'"></td></tr></tbody></table></div></section>
<nav class="pagination" th:if="${orders.totalPages>1}" aria-label="내 주문 페이지"><a th:if="${orders.hasPrevious()}" th:href="@{/mypage(page=${orders.number-1})}">이전</a><span th:text="${orders.number+1}+' / '+${orders.totalPages}"></span><a th:if="${orders.hasNext()}" th:href="@{/mypage(page=${orders.number+1})}">다음</a></nav>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
