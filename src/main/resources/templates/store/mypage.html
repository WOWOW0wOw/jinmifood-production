<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마이페이지 | 진미푸드</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments :: header}"></header>
<main class="section wrap"><div class="page-title"><span class="eyebrow">MY PAGE</span><h1>마이페이지</h1><p th:text="${member.name}+' 회원님의 주문과 포인트입니다.'"></p></div>
<section class="member-summary"><div><small>보유 포인트</small><strong th:text="${#numbers.formatInteger(member.points,1,'COMMA')}+'P'"></strong></div><div><small>회원 이메일</small><strong th:text="${member.email}"></strong></div><div><small>적립 혜택</small><strong>결제 상품금액의 10%</strong></div></section>
<section class="admin-card my-orders"><div class="admin-card-head"><h2>주문 내역</h2></div><div class="empty" th:if="${#lists.isEmpty(orders)}">아직 주문 내역이 없습니다.</div><div class="table-wrap" th:unless="${#lists.isEmpty(orders)}"><table><thead><tr><th>주문번호</th><th>주문일</th><th>상태</th><th>결제금액</th><th>사용/적립 포인트</th></tr></thead><tbody><tr th:each="o:${orders}"><td th:text="${o.orderNumber}"></td><td th:text="${#temporals.format(o.createdAt,'yyyy-MM-dd HH:mm')}"></td><td><span class="status" th:text="${o.status.label}"></span></td><td th:text="${#numbers.formatInteger(o.totalAmount,1,'COMMA')}+'원'"></td><td th:text="${#numbers.formatInteger(o.pointsUsed,1,'COMMA')}+'P 사용 / '+${#numbers.formatInteger(o.pointsEarned,1,'COMMA')}+'P 적립'"></td></tr></tbody></table></div></section>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
