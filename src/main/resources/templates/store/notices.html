<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공지사항 | 진미푸드</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/community.css"><link rel="stylesheet" href="/css/pagination.css"></head><body><header th:replace="~{fragments :: header}"></header><main class="section wrap board-page"><div class="page-title"><span class="eyebrow">NOTICE</span><h1>공지사항</h1><p>진미푸드의 새로운 소식을 알려드립니다.</p></div><section class="board"><div class="board-row board-label"><span>구분</span><strong>제목</strong><time>등록일</time></div><a class="board-row" th:each="notice:${notices.content}" th:href="@{/community/notices/{id}(id=${notice.id})}"><span th:class="${notice.pinned}?'pin':''" th:text="${notice.pinned}?'중요':'공지'"></span><strong th:text="${notice.title}"></strong><time th:text="${#temporals.format(notice.createdAt,'yyyy.MM.dd')}"></time></a><div class="empty compact" th:if="${notices.empty}">등록된 공지사항이 없습니다.</div></section><nav class="pagination" th:if="${notices.totalPages>1}"><a th:if="${notices.hasPrevious()}" th:href="@{/community/notices(page=${notices.number-1})}">이전</a><span th:text="${notices.number+1}+' / '+${notices.totalPages}"></span><a th:if="${notices.hasNext()}" th:href="@{/community/notices(page=${notices.number+1})}">다음</a></nav></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
