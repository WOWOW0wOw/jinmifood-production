<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 완료 | 진미푸드</title><link rel="stylesheet" href="/css/style.css?v=20260820-1"><th:block th:replace="~{fragments :: storefrontHead}"></th:block></head><body><header th:replace="~{fragments :: header}"></header><main class="section wrap"><div class="complete-card"><span>✓</span><h1>결제가 완료되었습니다</h1><p>주문을 확인했습니다. 배송 준비가 시작되면 안내드리겠습니다.</p><div><small>주문번호</small><strong th:text="${order.orderNumber}"></strong></div><div><small>결제수단</small><strong th:text="${order.paymentMethod?:'토스페이먼츠'}"></strong></div><div><small>포인트 할인</small><strong th:text="${#numbers.formatInteger(order.pointsUsed,1,'COMMA')}+'P'"></strong></div><div><small>결제 금액</small><strong th:text="${#numbers.formatInteger(order.totalAmount,1,'COMMA')}+'원'"></strong></div><div th:if="${order.member}"><small>적립 포인트</small><strong th:text="${#numbers.formatInteger(order.pointsEarned,1,'COMMA')}+'P'"></strong></div><a class="btn" th:href="${order.member!=null}?'/mypage':'/'" th:text="${order.member!=null}?'마이페이지로 이동':'홈으로 돌아가기'"></a></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
