<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제하기 | 진미푸드</title><link rel="stylesheet" href="/css/style.css"><script src="https://js.tosspayments.com/v2/standard" defer></script><script src="/js/toss-payment.js" defer></script></head><body><header th:replace="~{fragments :: header}"></header><main class="section wrap"><div class="complete-card payment-card"><span>₩</span><h1>결제하기</h1><p>주문 내용을 확인한 뒤 토스 결제창을 열어 주세요.</p><div><small>주문번호</small><strong th:text="${order.orderNumber}"></strong></div><div><small>주문상품</small><strong th:text="${orderName}"></strong></div><div><small>결제 금액</small><strong th:text="${#numbers.formatInteger(order.totalAmount,1,'COMMA')}+'원'"></strong></div><p class="form-error" th:unless="${paymentConfigured}">토스 클라이언트 키가 설정되지 않았습니다. 관리자에게 문의해 주세요.</p><p id="payment-error" class="form-error" hidden></p><button id="toss-payment-button" class="btn btn-block" type="button" th:disabled="${!paymentConfigured}" th:data-client-key="${clientKey}" th:data-order-id="${order.orderNumber}" th:data-order-name="${orderName}" th:data-amount="${order.totalAmount}" th:data-customer-name="${order.customerName}" th:data-customer-email="${order.email}" th:data-success-url="${successUrl}" th:data-fail-url="${failUrl}">토스로 결제하기</button><a href="/cart">장바구니로 돌아가기</a></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
