<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${product.name}+' | 진미푸드'">
</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/product-detail.css">
</head>
<body>
<header th:replace="~{fragments :: header}">
</header>
<main class="section wrap">
<div class="product-detail">
<div class="detail-image">
<img th:src="${product.imageUrl}" th:alt="${product.name}">
</div>
<div class="detail-content">
<small th:text="${product.category.name}">
</small>
<h1 th:text="${product.name}">
</h1>
<p class="summary" th:text="${product.summary}">
</p>
<div class="price">
<del th:if="${product.originalPrice}" th:text="${#numbers.formatInteger(product.originalPrice,1,'COMMA')}+'원'">
</del>
<strong th:text="${#numbers.formatInteger(product.price,1,'COMMA')}+'원'">
</strong>
</div>
<dl>
<div>
<dt>배송비</dt>
<dd>3,500원 (5만원 이상 무료)</dd>
</div>
<div>
<dt>재고</dt>
<dd th:text="${product.stock > 0}?'구매 가능':'품절'">
</dd>
</div>
</dl>
<div class="product-notice">
<h2>상품 필수정보</h2>
<dl>
<div>
<dt>원산지</dt>
<dd th:text="${#strings.isEmpty(product.origin) ? '상품 포장지 별도 표기' : product.origin}">
</dd>
</div>
<div>
<dt>제조·판매원</dt>
<dd th:text="${#strings.isEmpty(product.manufacturer) ? '상품 포장지 별도 표기' : product.manufacturer}">
</dd>
</div>
<div>
<dt>중량·수량</dt>
<dd th:text="${#strings.isEmpty(product.weight) ? '상품명 및 상세정보 참조' : product.weight}">
</dd>
</div>
<div>
<dt>소비기한</dt>
<dd th:text="${#strings.isEmpty(product.shelfLife) ? '상품 포장지 별도 표기' : product.shelfLife}">
</dd>
</div>
<div>
<dt>보관방법</dt>
<dd th:text="${#strings.isEmpty(product.storageMethod) ? '수령 후 냉장 또는 냉동 보관' : product.storageMethod}">
</dd>
</div>
</dl>
</div>
<form th:action="@{/cart/add}" method="post" class="buy-box">
<input type="hidden" name="productId" th:value="${product.id}">
<input type="hidden" name="returnUrl" th:value="@{/products/{slug}(slug=${product.slug})}">
<label>수량 <input type="number" name="quantity" value="1" min="1" th:max="${product.stock}">
</label>
<button class="btn" th:disabled="${product.stock == 0}" th:text="${product.stock == 0}?'품절':'장바구니 담기'">
</button>
</form>
<p class="safe-note">✓ 결제 전 주문 내용을 한 번 더 확인할 수 있습니다.</p>
</div>
</div>
<section class="detail-description">
<h2>상품 상세정보</h2>
<p th:text="${product.description}">
</p>
<img class="catalog-detail-image" th:if="${!#strings.isEmpty(product.detailImageUrl)}"
     th:src="${product.detailImageUrl}" th:alt="${product.name}+' 상세 설명'" loading="lazy">
<div class="info-panel">
<h3>구매 전 확인해 주세요</h3>
<ul>
<li>건어물 특성상 크기와 색상에 차이가 있을 수 있습니다.</li>
<li>수령 후 냉장 또는 냉동 보관해 주세요.</li>
<li>식품의 단순 변심 반품은 상품 상태에 따라 제한될 수 있습니다.</li>
</ul>
</div>
</section>
</main>
<footer th:replace="~{fragments :: footer}">
</footer>
<div class="toast" th:if="${message}" th:text="${message}">
</div>
</body>
</html>
