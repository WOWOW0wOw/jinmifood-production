<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전체상품 | 진미푸드</title><link rel="stylesheet" href="/css/style.css?v=20260820-1"><th:block th:replace="~{fragments :: storefrontHead}"></th:block><link rel="stylesheet" href="/css/pagination.css"></head><body><header th:replace="~{fragments :: header}"></header><main class="section wrap product-list-page"><div class="page-title"><span class="eyebrow">JINMI MARKET</span><h1 th:text="${query != null and !query.isBlank()} ? '검색 결과' : '좋은 재료를 한곳에'">좋은 재료를 한곳에</h1><p th:if="${query}" th:text="'‘'+${query}+'’ 검색 결과 '+${products.totalElements}+'개'"></p><p th:unless="${query}">정직하게 고른 진미푸드의 모든 상품을 만나보세요.</p></div><div class="catalog-toolbar"><div class="filter"><a href="/products" th:classappend="${selectedCategory == null}?'active'">전체</a><a th:each="c:${categories}" th:href="@{/products(category=${c.slug})}" th:text="${c.name}" th:classappend="${selectedCategory == c.slug}?'active'"></a></div><span class="result-count" th:text="'총 '+${products.totalElements}+'개 상품'"></span></div><div class="empty" th:if="${products.empty}"><span>⌕</span><h2>상품을 찾지 못했습니다</h2><p>다른 검색어 또는 카테고리를 선택해 주세요.</p><a class="btn" href="/products">전체 상품 보기</a></div><div class="product-grid"><article class="product-card" th:each="p:${products.content}"><a th:href="@{/products/{slug}(slug=${p.slug})}" class="product-image"><img th:src="${p.imageUrl}" th:alt="${p.name}" width="1254" height="1254" loading="lazy" decoding="async"><span th:if="${p.stock == 0}">SOLD OUT</span></a><div class="product-info"><small th:text="${p.category.name}"></small><h3><a th:href="@{/products/{slug}(slug=${p.slug})}" th:text="${p.name}"></a></h3><p th:text="${p.summary}"></p><div><em th:if="${p.originalPrice != null and p.originalPrice > p.price}" th:text="${(p.originalPrice-p.price)*100/p.originalPrice}+'%'"></em><del th:if="${p.originalPrice}" th:text="${#numbers.formatInteger(p.originalPrice,1,'COMMA')}+'원'"></del><strong th:text="${#numbers.formatInteger(p.price,1,'COMMA')}+'원'"></strong></div></div></article></div><nav class="pagination" th:if="${products.totalPages>1}" aria-label="상품 목록 페이지"><a th:if="${products.hasPrevious()}" th:href="@{/products(category=${selectedCategory},q=${query},page=${products.number-1})}">← 이전</a><span th:text="${products.number+1}+' / '+${products.totalPages}"></span><a th:if="${products.hasNext()}" th:href="@{/products(category=${selectedCategory},q=${query},page=${products.number+1})}">다음 →</a></nav></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
