<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전체상품 | 진미푸드</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments :: header}"></header><main class="section wrap"><div class="page-title"><span class="eyebrow">JINMI MARKET</span><h1 th:text="${query != null and !query.isBlank()} ? '검색 결과' : '전체상품'">전체상품</h1><p th:if="${query}" th:text="'‘'+${query}+'’ 검색 결과입니다.'"></p></div><div class="filter"><a href="/products" th:classappend="${selectedCategory == null}?'active'">전체</a><a th:each="c:${categories}" th:href="@{/products(category=${c.slug})}" th:text="${c.name}" th:classappend="${selectedCategory == c.slug}?'active'"></a></div><div class="empty" th:if="${#lists.isEmpty(products)}"><h2>상품을 찾지 못했습니다</h2><p>다른 검색어 또는 카테고리를 선택해 주세요.</p></div><div class="product-grid"><article class="product-card" th:each="p:${products}"><a th:href="@{/products/{slug}(slug=${p.slug})}" class="product-image"><img th:src="${p.imageUrl}" th:alt="${p.name}"><span th:if="${p.stock == 0}">품절</span></a><div class="product-info"><small th:text="${p.category.name}"></small><h3><a th:href="@{/products/{slug}(slug=${p.slug})}" th:text="${p.name}"></a></h3><p th:text="${p.summary}"></p><div><del th:if="${p.originalPrice}" th:text="${#numbers.formatInteger(p.originalPrice,1,'COMMA')}+'원'"></del><strong th:text="${#numbers.formatInteger(p.price,1,'COMMA')}+'원'"></strong></div></div></article></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
